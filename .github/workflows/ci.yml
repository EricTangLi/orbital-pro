name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust（core / mcp / proxy）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 测试（根 workspace）
        run: cargo test --workspace --locked

      - name: Clippy（警告即失败）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend:
    name: 前端（TypeScript + Vite）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build
